# Builds and tests every shipped binary on every PR/push; on a v* tag also publishes to npm.
# npm trusted publishing is bound to this file name (ci.yml) and the `npm` environment.
name: CI

on:
  pull_request:
    paths-ignore: ['**.md', 'LICENSE']
  push:
    branches: [master]
    tags: ['v*'] # path filters are not evaluated for tag pushes
    paths-ignore: ['**.md', 'LICENSE']
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  native:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: darwin-arm64, os: macos-15 }
          - { target: darwin-x64, os: macos-15-intel } # last Intel image, available until Aug 2027
          - { target: win32-x64, os: windows-2025 }
          - { target: win32-arm64, os: windows-11-arm }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npx node-gyp rebuild
      # move the binary into node_modules/@cbor-extract/ so tests load it through index.js, exactly as users will
      - run: node scripts/platform-package.cjs stage "$TARGET" - build/Release/extract.node && rm -rf build
        env:
          TARGET: ${{ matrix.target }}
      - run: npm test
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm test
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          package-manager-cache: false
      - run: npm test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin-${{ matrix.target }}
          path: node_modules/@cbor-extract/
          if-no-files-found: error

  linux:
    name: ${{ matrix.target }}-${{ matrix.libc }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            libc: glibc
            os: ubuntu-24.04
            build: node:22-bookworm@sha256:18a6d90fd60542269850c80ca03b29b1d9b14d6b221ac7ee8e35b0d33ef904bd
            # the RHEL 8 image runs the binary on the glibc 2.28 floor
            test: >-
              node:24-bookworm-slim@sha256:c86ecead9e55a5210ac1727de38a4ca840bf03dcaf34dc9749addbf383b1920c
              node:26-bookworm-slim@sha256:bc0a2afd3b74ce12222fc8bab99271e66257f021078f5f4a5d687a77d280c1d9
              registry.access.redhat.com/ubi8/nodejs-22@sha256:53e0938bb3a265a0251b08566d304b4997559f116a94e7b59bb3798be65bdfcb
          - target: linux-x64
            libc: musl
            os: ubuntu-24.04
            build: node:22-alpine@sha256:fe4f6d74e20370acb04ad889077d14d0f64a9c8ea6a42bc60cddf1e844699914
            test: >-
              node:24-alpine@sha256:8a32c8cf649a49915a66e81e7a609223c708d0adabf288ee3f4077d765542f85
              node:26-alpine@sha256:c6ad9e9c1d80f6eb607c26b4b0a132ff7a2344fad1c78ea3baa2a7d4c8de6d94
          - target: linux-arm64
            libc: glibc
            os: ubuntu-24.04-arm
            build: node:22-bookworm@sha256:18a6d90fd60542269850c80ca03b29b1d9b14d6b221ac7ee8e35b0d33ef904bd
            test: >-
              node:24-bookworm-slim@sha256:c86ecead9e55a5210ac1727de38a4ca840bf03dcaf34dc9749addbf383b1920c
              node:26-bookworm-slim@sha256:bc0a2afd3b74ce12222fc8bab99271e66257f021078f5f4a5d687a77d280c1d9
              registry.access.redhat.com/ubi8/nodejs-22@sha256:53e0938bb3a265a0251b08566d304b4997559f116a94e7b59bb3798be65bdfcb
          - target: linux-arm64
            libc: musl
            os: ubuntu-24.04-arm
            build: node:22-alpine@sha256:fe4f6d74e20370acb04ad889077d14d0f64a9c8ea6a42bc60cddf1e844699914
            test: >-
              node:24-alpine@sha256:8a32c8cf649a49915a66e81e7a609223c708d0adabf288ee3f4077d765542f85
              node:26-alpine@sha256:c6ad9e9c1d80f6eb607c26b4b0a132ff7a2344fad1c78ea3baa2a7d4c8de6d94
          # armv7: built and tested under QEMU. Node 22 is the last line with official armv7 builds.
          - target: linux-arm
            libc: glibc
            os: ubuntu-24.04
            platform: linux/arm/v7
            build: node:22-bookworm@sha256:18a6d90fd60542269850c80ca03b29b1d9b14d6b221ac7ee8e35b0d33ef904bd
          - target: linux-arm
            libc: musl
            os: ubuntu-24.04
            platform: linux/arm/v7
            build: node:22-alpine@sha256:fe4f6d74e20370acb04ad889077d14d0f64a9c8ea6a42bc60cddf1e844699914
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: matrix.platform
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: docker.io/tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm
      - name: Build and test
        env:
          TARGET: ${{ matrix.target }}
          LIBC: ${{ matrix.libc }}
          PLATFORM: ${{ matrix.platform }}
          BUILD_IMAGE: ${{ matrix.build }}
        run: |
          docker run --rm ${PLATFORM:+--platform "$PLATFORM"} -v "$PWD:/w" -w /w -e TARGET -e LIBC "$BUILD_IMAGE" sh -ec '
            if [ "$LIBC" = musl ]; then apk add --no-cache python3 make g++; fi
            npm ci --ignore-scripts
            npx node-gyp rebuild
            if [ "$LIBC" = glibc ]; then scripts/check-glibc.sh build/Release/extract.node; fi
            node scripts/platform-package.cjs stage "$TARGET" "$LIBC" build/Release/extract.node && rm -rf build
            npm test'
      - name: Test on other Node.js versions and distros
        if: matrix.test
        env:
          TEST_IMAGES: ${{ matrix.test }}
        run: |
          for image in $TEST_IMAGES; do
            docker run --rm --user "$(id -u)" -v "$PWD:/w:ro" -w /w "$image" sh -ec 'node --version; node --test "test/*.test.cjs"'
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin-${{ matrix.target }}-${{ matrix.libc }}
          path: node_modules/@cbor-extract/
          if-no-files-found: error

  package:
    needs: [native, linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bin-*
          merge-multiple: true
          path: npm
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      # writes every platform package.json and sets optionalDependencies to exactly what was built
      - run: node scripts/platform-package.cjs finalize npm
      - run: |
          mkdir dist
          for dir in npm/*/; do npm pack "$dir" --pack-destination dist; done
          npm pack --pack-destination dist
          sha256sum dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: dist/
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: npm # required reviewers + tag-only deployment rule; the npm trusted publisher requires it
    permissions:
      contents: read
      id-token: write # npm trusted publishing + provenance, Sigstore for attestations
      attestations: write # store the attestation
      artifact-metadata: write # artifact storage record, per the actions/attest README
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit # switch to block with the allowlist from the first run's insights
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: dist
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24 # bundles npm 11.19, trusted publishing needs >= 11.5.1
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*.tgz
      # Platform packages first, cbor-extract last, so no published cbor-extract points at a missing binary.
      # Versions already on npm are skipped, so a failed run can simply be re-run.
      - name: Publish
        run: |
          publish() {
            read -r name version < <(tar -xOzf "$1" package/package.json | node -p 'const p = JSON.parse(require("fs").readFileSync(0)); `${p.name} ${p.version}`')
            if npm view "$name@$version" version > /dev/null 2>&1; then
              echo "$name@$version is already published"
              return
            fi
            tag=latest
            if [[ $version == *-* ]]; then tag=next; fi
            npm publish "$1" --access public --tag "$tag"
          }
          for tarball in dist/cbor-extract-cbor-extract-*.tgz; do publish "$tarball"; done
          publish dist/cbor-extract-[0-9]*.tgz
